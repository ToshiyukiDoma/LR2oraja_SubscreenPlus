<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>player1-score</title><style>html,body{margin:0;padding:0;width:100vw;height:100vh;background:transparent!important;color:inherit;font:inherit;overflow:hidden}#value{display:inline-block;white-space:nowrap;font-variant-numeric:tabular-nums}.wheel{display:inline-block;height:1em;overflow:hidden;vertical-align:top;width:.62em}.reel{display:flex;flex-direction:column;line-height:1em;transition:transform .18s cubic-bezier(.2,.75,.25,1);will-change:transform}.reel>span{height:1em;flex:none}</style></head><body><span id="value"></span><script>const el=document.getElementById('value');function paint(v){const s=String(Math.max(0,Number(v)||0)),old=el.dataset.value||'';if(old===s)return;if(old.length!==s.length){el.replaceChildren(...s.split('').map(()=>{const w=document.createElement('span');w.className='wheel';const r=document.createElement('span');r.className='reel';for(let d=0;d<10;d++){const c=document.createElement('span');c.textContent=d;r.append(c);}w.append(r);return w;}));requestAnimationFrame(()=>[...el.children].forEach((w,i)=>w.firstChild.style.transform=`translateY(-${Number(s[i])}em)`));}else [...el.children].forEach((w,i)=>w.firstChild.style.transform=`translateY(-${Number(s[i])}em)`);el.dataset.value=s;el.setAttribute('aria-label',s);}async function update(){try{const r=await fetch('/state.json',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json();paint(s.players[0].ex);}catch{}finally{setTimeout(update,200);}}update();</script></body></html>
