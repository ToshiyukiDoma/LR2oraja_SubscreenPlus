<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>player2-name</title><style>html,body{margin:0;padding:0;width:100vw;height:100vh;background:transparent!important;color:inherit;font:inherit;overflow:hidden}#value{display:inline-block;white-space:nowrap}</style></head><body><span id="value"></span><script>const el=document.getElementById('value');async function update(){try{const r=await fetch('/state.json',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json();el.textContent=String(s.players[1].name);}catch{}finally{setTimeout(update,200);}}update();</script></body></html>
