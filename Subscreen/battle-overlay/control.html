<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#142231"><title>LR2oraja Battle Control</title><style>
:root{color-scheme:dark;font:17px system-ui,sans-serif;background:#101b28;color:#edf3fb}*{box-sizing:border-box}body{margin:0;padding:16px;max-width:900px;margin-inline:auto}h1{font-size:1.3rem;margin:4px 0 14px}h2{font-size:1rem;color:#adc0d5;margin:0 0 8px}.card{background:#17283a;border:1px solid #2a4055;border-radius:14px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}button{min-height:54px;border:1px solid #3c5670;border-radius:10px;background:#263d53;color:#fff;font:600 1rem system-ui;touch-action:manipulation}button:active{background:#3e5f7c}button.primary{background:#176c69}button.danger{background:#8e333a}input{width:100%;min-height:52px;margin:6px 0 10px;padding:10px;border:1px solid #49647e;border-radius:9px;background:#0f1b28;color:#fff;font:inherit}.muted{color:#afc0d1;font-size:.9rem}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player{border-radius:10px;background:#203348;padding:12px}.score{font-size:1.6rem;font-weight:700}.hidden{display:none!important}#status{white-space:pre-wrap;color:#c8d8e8}.pill{display:inline-block;border-radius:99px;background:#263d53;padding:5px 10px;margin-bottom:10px}@media(max-width:480px){body{padding:10px}.grid{grid-template-columns:1fr 1fr}.card{padding:12px}}
</style></head><body>
<h1>LR2oraja Battle Control</h1><div id="phase" class="pill">CONNECTING</div>
<section class="card" id="login"><h2>ADMIN LOGIN</h2><label>Username</label><input id="user" value="admin" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="primary" id="loginButton">LOG IN</button><p class="muted">The generated password is shown in the server window. Login stays in this browser tab only.</p></section>
<section class="card hidden" id="controls"><h2>PLAYERS</h2><div class="players"><div class="player"><div id="p1name">Waiting for player</div><div class="score" id="p1score">0 EX</div><div id="p1status" class="muted">OFFLINE</div></div><div class="player"><div id="p2name">Waiting for player</div><div class="score" id="p2score">0 EX</div><div id="p2status" class="muted">OFFLINE</div></div></div><h2 style="margin-top:14px">CHART</h2><div id="song">Waiting for chart selection</div><div id="artist" class="muted"></div><div id="table" class="muted"></div><div class="grid" style="margin-top:12px"><button data-action="p1">USE PLAYER 1 CHART</button><button data-action="p2">USE PLAYER 2 CHART</button><button data-action="sync">CHECK SYNC</button><button class="primary" data-action="start">START BATTLE</button><button data-action="mode">TOGGLE SINGLE PLAYER</button><button class="danger" data-action="cancel">CANCEL ROUND</button></div></section>
<section class="card"><h2>SERVER STATUS</h2><div id="status">Loading…</div><div class="muted" id="difference"></div></section><script>
let password='',user='admin';const $=id=>document.getElementById(id),safe=(id,v)=>$(id).textContent=v??'';async function refresh(){try{const r=await fetch('/state.json',{cache:'no-store'});const s=await r.json();safe('phase',s.phase);safe('status',s.message);safe('song',s.title||'Waiting for chart selection');safe('artist',s.artist);safe('table',s.table);for(let i=0;i<2;i++){const p=s.players[i];safe('p'+(i+1)+'name',p.name);safe('p'+(i+1)+'score',p.ex+' EX');safe('p'+(i+1)+'status',p.connected?'CONNECTED':'WAITING');}safe('difference','P1 − P2: '+s.difference+' EX'+(s.singlePlayer?' · SINGLE PLAYER TEST':''));}catch(e){safe('status','SERVER OFFLINE');}finally{setTimeout(refresh,1000)}}
async function send(action){if(!password)return;const data=new URLSearchParams({user,password,action});try{const r=await fetch('/command',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:data});if(r.status===403){password='';$('controls').classList.add('hidden');$('login').classList.remove('hidden');safe('status','Login rejected. Check the admin password.');return;}if(!r.ok)throw Error();}catch(e){safe('status','Command failed. Check that LAN web access is enabled.');}}
$('loginButton').onclick=()=>{user=$('user').value.trim();password=$('password').value; if(user!=='admin'||!password){safe('status','Enter admin and the generated password.');return;} $('login').classList.add('hidden');$('controls').classList.remove('hidden');send('status');};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>send(b.dataset.action));refresh();
</script></body></html>
