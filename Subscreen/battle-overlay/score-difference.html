<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Score difference</title><style>html,body{margin:0;padding:0;width:100vw;height:100vh;background:transparent!important;overflow:hidden;color:inherit;font:inherit}#score{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}#value{display:inline-block;white-space:nowrap}#left,#right{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap}#left{left:calc(50% - 1.7em)}#right{left:calc(50% + 1.1em)}</style></head><body><div id="score"><span id="left"></span><span id="value">0</span><span id="right"></span></div><script>async function update(){try{const r=await fetch('/state.json',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json();document.getElementById('value').textContent=String(Math.abs(s.difference));document.getElementById('left').textContent=s.difference>0?'<':'';document.getElementById('right').textContent=s.difference<0?'>':'';const v=document.getElementById('value'),l=document.getElementById('left'),rgt=document.getElementById('right'),cs=getComputedStyle(v);for(const e of [l,rgt]){e.style.color=cs.color;e.style.fontFamily=cs.fontFamily;e.style.fontSize=cs.fontSize;e.style.fontWeight=cs.fontWeight;e.style.fontStyle=cs.fontStyle;e.style.letterSpacing=cs.letterSpacing;e.style.textShadow=cs.textShadow;e.style.webkitTextStroke=cs.webkitTextStroke;}const b=v.getBoundingClientRect(),gap=parseFloat(cs.fontSize)*.2;const centerY=b.top+b.height/2;l.style.top=centerY+'px';rgt.style.top=centerY+'px';l.style.left=Math.max(0,b.left-l.getBoundingClientRect().width-gap)+'px';rgt.style.left=(b.right+gap)+'px';}catch{}finally{setTimeout(update,200);}}update();</script></body></html>
