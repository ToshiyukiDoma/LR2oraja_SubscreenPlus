<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>title</title><style>html,body{margin:0;padding:0;width:100vw;height:100vh;background:transparent!important;color:inherit;font:inherit;overflow:hidden}#viewport{width:100vw;overflow:hidden;white-space:nowrap}#value{display:inline-block;white-space:nowrap}#viewport.scrolling #value{padding-right:10vw;animation:lr2-scroll var(--duration,12s) ease-in-out infinite alternate}@keyframes lr2-scroll{from{transform:translateX(0)}to{transform:translateX(calc(-1 * var(--overflow,0px)))}}</style></head><body><div id="viewport"><span id="value"></span></div><script>const viewport=document.getElementById('viewport'),value=document.getElementById('value');function measure(){const distance=Math.max(0,value.scrollWidth-viewport.clientWidth);if(distance>1){viewport.classList.add('scrolling');viewport.style.setProperty('--overflow',distance+'px');viewport.style.setProperty('--duration',Math.max(7,Math.min(25,distance/35))+'s');viewport.style.textAlign='left';}else{viewport.classList.remove('scrolling');viewport.style.removeProperty('--overflow');viewport.style.removeProperty('--duration');viewport.style.removeProperty('text-align');}}window.addEventListener('resize',measure);const observer=new ResizeObserver(measure);observer.observe(viewport);observer.observe(value);async function update(){try{const r=await fetch('/state.json',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json(),next=String(s.title||'');if(value.textContent!==next){value.textContent=next;requestAnimationFrame(measure);}}catch{}finally{setTimeout(update,200);}}update();</script></body></html>
